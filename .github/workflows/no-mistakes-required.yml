name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  # The job NAME is the published check name and may be a required status check
  # on a protecting branch, so it stays byte-stable across changes to what the
  # check actually decides. bin/fm-pr-body-compliance.sh owns that decision.
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
      - name: Verify declared delivery path in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          # Pass the body through a file rather than an argument: a PR body is
          # attacker-controlled text of arbitrary length, and a file keeps it
          # data instead of anything the shell could reinterpret.
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body.txt"
          if bin/fm-pr-body-compliance.sh \
            --body-file "$RUNNER_TEMP/pr-body.txt" \
            --author-association "${PR_AUTHOR_ASSOCIATION:-}" \
            --author "${PR_AUTHOR:-}" \
            --pr "${PR_NUMBER:-}" > "$RUNNER_TEMP/verdict.txt"; then
            cat "$RUNNER_TEMP/verdict.txt"
            # Publish which path was taken, so a declared bypass is a visible
            # record on the run rather than a green tick that says nothing.
            {
              echo '### Delivery path'
              echo
              sed 's/^/- /' "$RUNNER_TEMP/verdict.txt"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1
